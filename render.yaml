services:
  - type: web
    name: paralisetu-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_PHONES
        value: "+919810000001,+919810000002,+919810000003"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
